<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>みずやりゲーム</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    color: #14361f; overflow: hidden; background: #bfe9ff;
  }

  /* ---------- 画面全体 ---------- */
  #app {
    position: relative;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    overflow: hidden;
    background: linear-gradient(#8ed8ff 0%, #b9e8ff 42%, #dff4ff 58%, #c6e9a8 58%, #a9dc86 100%);
  }
  #bgbox { position: absolute; inset: 0; z-index: 0; }
  #bgbox > .bgimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .3s; }
  #bgbox.img-ok > .bgimg { opacity: 1; }

  /* ---------- 上の表示 ---------- */
  header {
    position: relative; z-index: 5; flex: 0 0 auto;
    padding: clamp(6px, 1.2vmin, 16px) clamp(10px, 2.4vmin, 28px) 0;
    text-align: center;
  }
  #bloomLine {
    font-size: clamp(22px, 5.6vmin, 46px);
    font-weight: 800; line-height: 1.12; letter-spacing: .02em;
    color: #0c4b2c;
    text-shadow: 0 2px 0 #ffffff, 0 3px 10px rgba(255,255,255,.75);
  }
  #bloomLine .num { color: #e0641d; }
  #barRow {
    display: grid;
    grid-template-columns: 1fr minmax(0, 58vmin) 1fr;
    align-items: center;
    gap: clamp(6px, 1.4vmin, 14px);
    margin: clamp(4px, 1vmin, 12px) 0 0;
  }
  #barTrack {
    position: relative; width: 100%;
    height: clamp(15px, 2.7vmin, 26px);
    background: #ffffff; border: 3px solid #2f7d4f; border-radius: 999px;
    overflow: hidden;
  }
  #barFill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: linear-gradient(90deg, #8ad8ff, #46c46f);
    border-radius: 999px;
    transition: width .08s linear;
  }
  #barText {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(10px, 1.7vmin, 14px); font-weight: 700;
    color: #14432a; opacity: .7; letter-spacing: .02em;
    text-shadow: 0 1px 0 rgba(255,255,255,.9);
  }
  #waterLine {
    justify-self: start;
    font-size: clamp(12px, 2.1vmin, 20px); font-weight: 700;
    color: #14502f; white-space: nowrap;
  }

  /* ---------- まんなかの舞台 ---------- */
  #scene {
    position: relative; z-index: 2;
    flex: 1 1 auto; min-height: 0; overflow: hidden;
  }

  :root {
    --soilW: min(80vmin, 760px);
    --soilH: min(18vmin, 170px);
    --moundH: calc(var(--soilH) * 1.15);
    --plantH: min(60vmin, 50vh, 600px);
    --canW: min(28vmin, 240px);
    --canH: calc(var(--canW) * 0.95);
    --moundBottom: 5.5%;
    --dropW: min(1.7vmin, 12px);
  }
  /* 縦向きは空が広く余るので、土を少し上げる */
  @media (orientation: portrait) {
    :root { --moundBottom: 16%; }
  }

  /* 土（ひとつの山）。#moundFront は同じ山の写しで、植物の根元より下だけを手前に重ねる（植物が土に植わって見える） */
  :root { --plantDepth: calc(var(--moundH) * 0.16); }
  #mound, #moundFront {
    position: absolute; left: 50%; bottom: var(--moundBottom);
    width: var(--soilW); height: var(--moundH);
    transform: translateX(-50%);
    border-radius: 50% 50% 46% 46% / 72% 72% 28% 28%;
    overflow: hidden; z-index: 1;
    box-shadow: 0 10px 22px rgba(60,40,20,.16);
  }
  #moundFront { z-index: 3; clip-path: inset(16% 0 0 0); pointer-events: none; }
  #mound > .asset, #moundFront > .asset { object-fit: cover; }
  #soilFallback, #moundFront > .fallback {
    position: absolute; inset: 0;
    background: linear-gradient(#a56e46 0%, #90603a 34%, #7d4f2c 78%);
  }
  #mound::after, #moundFront::after {
    content: ""; position: absolute; left: 4%; right: 4%; top: -6%; height: 46%;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 55%, rgba(214,160,116,.55), rgba(214,160,116,0) 72%);
    pointer-events: none;
  }
  .swap.img-ok > .fallback { opacity: 0; }

  /* 絵の差し替え（images/ にあれば使う） */
  .swap { position: relative; }
  .swap > .asset {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; object-position: 50% 100%;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .swap > .fallback { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 1; transition: opacity .2s; }
  .swap.img-ok > .asset { opacity: 1; }

  /* 植物（育ちぐあいの段階ごと） */
  /* 株もとの植え穴。下半分は手前の土に隠れ、奥の縁だけが暗く見える */
  #soilLip {
    position: absolute; left: 50%; z-index: 1;
    bottom: calc(var(--moundBottom) + var(--moundH) - var(--plantDepth) - var(--soilW) * 0.02);
    width: calc(var(--soilW) * 0.17); height: calc(var(--soilW) * 0.04);
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 70%, rgba(58,32,16,.75) 0%, rgba(74,42,22,.55) 50%, rgba(90,52,28,0) 72%);
    pointer-events: none;
  }

  #plant {
    position: absolute; left: calc(50% - var(--plantH) / 2);
    bottom: calc(var(--moundBottom) + var(--moundH) - var(--plantDepth) - 3px);
    width: var(--plantH); height: var(--plantH);
    /* 同じ段階の中でも、秒が増えるほど少しずつ背が伸びる（--grow は 0.8〜1）。
       真ん中に置くのは left で行い、transform に translate を入れない（ぽよんの scale で横にずれないように） */
    transform: scale(var(--grow, 1)); transform-origin: 50% 100%;
    transition: transform .6s cubic-bezier(.3,1.5,.5,1);
    z-index: 2;
  }
  /* ふだんもゆっくり息をするように揺れる。音が聞こえたら（1秒に届く前から）大きく揺れる。
     0.5秒たまるごとに、ぽよんと弾む（transform とは別の scale・rotate で重ねる） */
  #plant { animation: breathe 3.2s ease-in-out infinite alternate; }
  #plant.hear { animation: sway .46s ease-in-out infinite alternate; }
  #plant.boing { animation: boing .42s ease-out, breathe 3.2s ease-in-out infinite alternate; }
  #plant.hear.boing { animation: boing .42s ease-out, sway .46s ease-in-out infinite alternate; }
  @keyframes breathe { from { rotate: -1.2deg; } to { rotate: 1.2deg; } }
  @keyframes sway { from { rotate: -4.5deg; } to { rotate: 4.5deg; } }
  @keyframes boing {
    0% { scale: 1 1; }
    30% { scale: 1.13 .88; }
    60% { scale: .95 1.1; }
    100% { scale: 1 1; }
  }
  /* 種は、音が聞こえるとぷるぷる震える（芽が出そう） */
  #plant > .stage[data-stage="seed"] > .asset, #plant > .stage[data-stage="seed"] > .fallback { transform-origin: 50% 80%; }
  #plant.hear > .stage[data-stage="seed"] > .asset, #plant.hear > .stage[data-stage="seed"] > .fallback { animation: jiggle .12s linear infinite alternate; }
  @keyframes jiggle { from { rotate: -5deg; translate: -1.5% 0; } to { rotate: 5deg; translate: 1.5% -3%; } }
  /* 音が聞こえている間、音符がふわふわ上がる */
  #notes {
    position: absolute; left: 50%; z-index: 3; width: 0; height: 0; pointer-events: none;
    bottom: calc(var(--moundBottom) + var(--moundH));
  }
  #notes i {
    position: absolute; left: 0; bottom: 0; font-style: normal; font-weight: 900;
    font-size: var(--ns, 30px); line-height: 1; color: var(--nc, #ff8fb3);
    -webkit-text-stroke: 1.5px #fff; paint-order: stroke fill;
    text-shadow: 0 3px 0 rgba(255,255,255,.95), 0 4px 10px rgba(30,80,120,.25);
    animation: noteUp 1.5s cubic-bezier(.25,.6,.4,1) forwards;
  }
  @keyframes noteUp {
    0% { transform: translate(var(--nx0), 0) scale(.3) rotate(0deg); opacity: 0; }
    15% { transform: translate(calc(var(--nx0) + var(--nw) * .3), -14%) scale(1.15) rotate(var(--nr)); opacity: 1; }
    50% { transform: translate(calc(var(--nx0) - var(--nw) * .5), calc(var(--ny) * -.5)) scale(1) rotate(calc(var(--nr) * -1)); opacity: 1; }
    100% { transform: translate(calc(var(--nx0) + var(--nw)), calc(var(--ny) * -1)) scale(.9) rotate(var(--nr)); opacity: 0; }
  }
  /* 水が落ちる所のしぶき */
  #splash { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 4; pointer-events: none; opacity: 0; transition: opacity .2s; }
  #splash.on { opacity: 1; }
  #splash i {
    position: absolute; left: -22px; top: -7px; width: 44px; height: 14px; border-radius: 50%;
    border: 3px solid rgba(120,200,250,.9); opacity: 0;
  }
  #splash b {
    position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%;
    background: #8fd3fb; opacity: 0;
  }
  #splash.on i { animation: ripple .82s ease-out infinite; }
  #splash.on i:nth-child(2) { animation-delay: .41s; }
  #splash.on b { animation: hop .82s ease-out infinite; }
  #splash.on b:nth-child(3) { --hx: -22px; }
  #splash.on b:nth-child(4) { --hx: 4px; animation-delay: .27s; }
  #splash.on b:nth-child(5) { --hx: 24px; animation-delay: .54s; }
  @keyframes ripple { 0% { transform: scale(.3); opacity: .95; } 100% { transform: scale(1.5); opacity: 0; } }
  @keyframes hop {
    0% { transform: translate(0, 0) scale(.6); opacity: 0; }
    15% { opacity: 1; }
    50% { transform: translate(calc(var(--hx, 0px) * .6), -20px) scale(1); opacity: 1; }
    100% { transform: translate(var(--hx, 0px), 2px) scale(.7); opacity: 0; }
  }
  /* 次の段階へ進んだ時、土からニョキッと伸び上がる */
  #plant > .stage.nyoki { opacity: 1; transition: none; animation: nyoki .75s cubic-bezier(.25,1.4,.5,1) both; }
  @keyframes nyoki {
    0% { transform: translateX(-50%) scale(.55, .12); }
    45% { transform: translateX(-50%) scale(.88, 1.2); }
    70% { transform: translateX(-50%) scale(1.08, .93); }
    85% { transform: translateX(-50%) scale(.98, 1.03); }
    100% { transform: translateX(-50%) scale(1, 1); }
  }
  /* 伸び上がる時に根元からはじける粒 */
  #pon {
    position: absolute; left: 50%; z-index: 4; width: 0; height: 0; pointer-events: none;
    bottom: calc(var(--moundBottom) + var(--moundH) - var(--plantDepth));
  }
  #pon i {
    position: absolute; left: 0; top: 0; width: var(--ps, 12px); height: var(--ps, 12px);
    margin: calc(var(--ps, 12px) / -2) 0 0 calc(var(--ps, 12px) / -2);
    border-radius: 50%; background: var(--pc, #8fd16a); opacity: 0;
  }
  #pon.go i { animation: pon .7s cubic-bezier(.2,.8,.4,1) both; }
  @keyframes pon {
    0% { transform: translate(0, 0) scale(.4); opacity: 1; }
    70% { opacity: 1; }
    100% { transform: translate(var(--px), var(--py)) scale(1); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    #plant { transition: none; }
    #plant, #plant.hear, #plant.boing, #plant.hear.boing, #plant > .stage.nyoki, #pon.go i,
    #plant.hear > .stage[data-stage="seed"] > .asset, #plant.hear > .stage[data-stage="seed"] > .fallback,
    #splash.on i, #splash.on b { animation: none; }
    #notes { display: none; }
  }
  #plant > .stage {
    position: absolute; left: 50%; bottom: 0;
    height: calc(var(--plantH) * var(--f));
    width: calc(var(--plantH) * var(--f) * var(--ar));
    transform: translateX(-50%);
    opacity: 0; transition: opacity .3s ease;
    transform-origin: 50% 100%;
  }
  #plant > .stage.show { opacity: 1; }
  /* 種は土に半分うまっている */
  #plant > .stage[data-stage="seed"] { bottom: calc(var(--plantH) * var(--f) * -0.22); }
  #plant.pop > .stage[data-stage="flower"] { animation: flowerPop .95s cubic-bezier(.34,1.56,.64,1); }
  @keyframes flowerPop {
    0% { transform: translateX(-50%) scale(1) rotate(0deg); }
    35% { transform: translateX(-50%) scale(1.18) rotate(-3deg); }
    68% { transform: translateX(-50%) scale(1.08) rotate(3deg); }
    100% { transform: translateX(-50%) scale(1) rotate(0deg); }
  }

  /* ---------- ジョウロ ---------- */
  /* 植物の左に置き、注ぎ口（右下）を植物へ向ける。
     音が聞こえたら立ったまま出て（.on）、水が出る時に傾ける（.pour） */
  #canWrap {
    position: absolute;
    left: calc(50% - var(--soilW) * 0.18 - var(--canW));
    bottom: calc(var(--moundBottom) + var(--moundH) + var(--plantH) * 0.50);
    width: var(--canW); height: var(--canH);
    z-index: 4; opacity: 0;
    transform: translateY(-14%) scale(.94);
    transition: opacity .32s ease, transform .42s cubic-bezier(.3,1.2,.6,1);
    pointer-events: none;
  }
  #canWrap.on { opacity: 1; transform: translateY(0) scale(1); }
  #canBox { width: 100%; height: 100%; transform-origin: 60% 25%; transform: rotate(0deg); transition: transform .45s cubic-bezier(.3,1.1,.5,1); }
  #canWrap.pour #canBox { transform: rotate(24deg); }

  /* ---------- 水の粒 ---------- */
  #drops { position: absolute; left: 75.8%; top: 78.7%; width: 0; height: 0; z-index: 5; pointer-events: none; --fall: 150px; --fallh: 60px; --dx: -100px; --dxh: -55px; }
  #drops .probe { position: absolute; width: 1px; height: 1px; opacity: 0; }
  /* 絵のジョウロ（images/can.png）は注ぎ口が上向きなので、傾けた時の注ぎ口の先が違う所に来る（試験/shiage.py が出す値） */
  #canBox.img-ok ~ #drops { left: 85%; top: 55%; }
  #drops .drop {
    position: absolute; left: 0; top: 0;
    width: var(--dropW); height: calc(var(--dropW) * 1.55);
    border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
    background: linear-gradient(#b3e7ff, #4fb4ee);
    opacity: 0;
  }
  #drops.img-ok .drop { background: url(images/drop.png) center / contain no-repeat; border-radius: 0; }
  #drops.on .drop { animation: dropFall .82s linear infinite; }
  @keyframes dropFall {
    0% { transform: translate(-50%, -6px) scaleY(.75); opacity: 0; }
    12% { opacity: 1; }
    55% { transform: translate(calc(-50% + var(--dxh)), var(--fallh)) scaleY(1); opacity: 1; }
    86% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), var(--fall)) scaleY(1.15); opacity: 0; }
  }

  /* ---------- キラキラ ---------- */
  #sparkles {
    position: absolute; left: 50%;
    bottom: calc(var(--moundBottom) + var(--moundH) + var(--plantH) * 0.72);
    width: 0; height: 0; z-index: 6; pointer-events: none;
  }
  #sparkles .ring {
    position: absolute; left: 50%; top: 50%;
    width: calc(var(--plantH) * .46); height: calc(var(--plantH) * .46);
    margin-left: calc(var(--plantH) * -.23); margin-top: calc(var(--plantH) * -.23);
    border-radius: 50%; border: 4px solid #ffe27a; opacity: 0;
  }
  #sparkles.go .ring { animation: ringOut 1.1s ease-out 3 both; }
  #sparkles.go .ring:nth-child(2) { animation-delay: .18s; border-color: #ffd0e2; }
  #sparkles.go .ring:nth-child(3) { animation-delay: .36s; border-color: #bff0a8; }
  @keyframes ringOut {
    0% { transform: scale(.35); opacity: .95; }
    100% { transform: scale(2.6); opacity: 0; }
  }

  /* ---------- ヒント ---------- */
  #hint {
    position: absolute; left: 50%; top: 5%;
    transform: translate(-50%, -6px);
    padding: .35em .95em; border-radius: 999px;
    background: rgba(255,255,255,.92); color: #2b6b4a;
    font-size: clamp(13px, 2.2vmin, 20px); font-weight: 700;
    box-shadow: 0 3px 10px rgba(20,60,40,.12);
    opacity: 0; transition: opacity .3s ease, transform .3s ease;
    pointer-events: none; z-index: 7; white-space: nowrap;
  }
  #hint.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- 下のボタン ---------- */
  footer {
    position: relative; z-index: 5; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    gap: clamp(10px, 2vmin, 22px);
    padding: clamp(6px, 1.4vmin, 14px) 12px calc(clamp(8px, 1.8vmin, 18px) + env(safe-area-inset-bottom));
  }
  #startBtn {
    font-family: inherit;
    font-size: clamp(18px, 3.2vmin, 28px); font-weight: 800;
    padding: .5em 1.7em; border: none; border-radius: 999px;
    background: #ffd75e; color: #5a3a00;
    box-shadow: 0 5px 0 #e0a800, 0 8px 16px rgba(90,58,0,.18);
    cursor: pointer; transition: transform .12s, box-shadow .12s, background .2s;
  }
  #startBtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #e0a800; }
  #againBtn {
    font-family: inherit;
    font-size: clamp(20px, 3.6vmin, 32px); font-weight: 800;
    padding: .5em 1.7em; border: none; border-radius: 999px;
    background: #ff9db5; color: #6a1430;
    box-shadow: 0 5px 0 #e0688a, 0 8px 16px rgba(106,20,48,.18);
    cursor: pointer;
  }
  #againBtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #e0688a; }
  [hidden] { display: none !important; }
  #startBtn:disabled { background: #d7ecdd; color: #3f6b50; box-shadow: 0 5px 0 #b3d3bd; cursor: default; }
  #gearBtn, #homeBtn {
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 800;
    width: clamp(38px, 6vmin, 52px); height: clamp(38px, 6vmin, 52px);
    border-radius: 50%; border: 3px solid #2f7d4f; background: #fff;
    font-size: clamp(18px, 2.8vmin, 24px); line-height: 1; cursor: pointer;
    color: #2f7d4f; padding: 0;
  }

  /* ---------- せってい ---------- */
  #settings {
    position: fixed; inset: 0; z-index: 30;
    display: none; align-items: center; justify-content: center;
    padding: 14px; background: rgba(8,30,20,.42);
  }
  #settings.open { display: flex; }
  #settingsBox {
    width: min(560px, 100%); max-height: 90dvh; overflow-y: auto; overflow-x: hidden;
    background: #fff; border-radius: 18px; padding: 18px 18px 22px;
    box-shadow: 0 18px 50px rgba(0,0,0,.35);
    font-size: clamp(13px, 1.7vmin, 16px); color: #173a28;
  }
  #settingsBox h2 { margin: 0 0 14px; font-size: 1.25em; color: #17603c; }
  .row { margin: 0 0 16px; }
  .row > .lab { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 700; margin-bottom: 6px; }
  .row .val { color: #b4501d; font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; height: 30px; accent-color: #2f9e5f; }
  .meterWrap { position: relative; height: 18px; background: #eef2f0; border-radius: 9px; overflow: hidden; border: 1px solid #cfe0d5; }
  #meterFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: linear-gradient(90deg,#bfe6ff,#4fb4ee); }
  #meterMark { position: absolute; top: -3px; bottom: -3px; width: 3px; background: #e0402a; left: 50%; }
  .meterScale { display: flex; justify-content: space-between; font-size: .78em; color: #6b8a79; margin-top: 3px; }
  .note { font-size: .85em; color: #4d6b5a; margin-top: 6px; line-height: 1.5; }
  .seg { display: flex; gap: 8px; }
  .seg button {
    flex: 1 1 0; font-family: inherit; font-size: 1em; padding: .55em 0;
    border: 2px solid #b9d5c5; background: #f5faf7; color: #24503a;
    border-radius: 10px; cursor: pointer;
  }
  .seg button.on { background: #2f9e5f; border-color: #2f9e5f; color: #fff; font-weight: 700; }
  .btns { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .btns button {
    font-family: inherit; font-size: 1em; padding: .65em 1.1em; border-radius: 10px;
    border: 2px solid #cfdcd6; background: #fff; color: #24503a; cursor: pointer;
  }
  .btns #closeSettings { flex: 1 1 auto; background: #2f9e5f; border-color: #2f9e5f; color: #fff; font-weight: 700; }

  /* ---------- マイクのエラー ---------- */
  #micErr {
    position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: min(560px, calc(100% - 24px));
    background: #fff6f2; border: 2px solid #e6a08a; border-radius: 14px;
    padding: 12px 14px; z-index: 40;
    font-size: clamp(12px, 1.6vmin, 15px); line-height: 1.55; color: #7a2a12;
    box-shadow: 0 10px 28px rgba(0,0,0,.18);
    display: none;
  }
  #micErr.show { display: block; }
  #micErr .t { font-weight: 800; margin-bottom: 4px; }
  #micErr .s { color: #8a4530; }
</style>
</head>
<body>

<script>
// 伸ばし音の判定（水やりゲームの核）。app.html にも同じ中身を埋め込む。
// マイクの生の波形を少しずつ受け取り、10ミリ秒ごとに「伸ばしている音か」を決める。
// 録音はしない。直近1秒ぶんの数値だけを手元に置き、古いものは捨てる。
(function (root) {
  'use strict';

  var DEFAULTS = {
    waterStartSec: 1.0,   // この秒数だけ伸びたら水が出る（本人の言葉: 1秒）
    bloomSec: 30,         // 合計でこの秒数伸ばしたら花が咲く（本人の言葉: 30秒）
    onDb: -45,            // これより大きい音を「鳴っている」とみなす（dBFS）
    tremoloDipDb: 6,      // 音量がこれだけ落ちて戻ったら「弓の返し」1回とみなす
    tremoloDips: 2,       // 0.7秒の中に返しがこの回数以上あればトレモロ
    tremoloWindowSec: 0.7,
    gapHoldSec: 0.15,     // 弓を返す一瞬の途切れはここまで許す
    minClarity: 0.6       // 音の高さがはっきりしている度合い（0〜1）。雑音や息を外す
  };

  var RANGES = {
    waterStartSec: [0.1, 10], bloomSec: [1, 3600], onDb: [-100, 0],
    tremoloDipDb: [1, 40], tremoloDips: [1, 20], tremoloWindowSec: [0.2, 2],
    gapHoldSec: [0, 1], minClarity: [0, 1]
  };

  function toDb(meanSq) { return meanSq > 1e-18 ? 10 * Math.log10(meanSq) : -120; }

  function Detector(sampleRate, opts) {
    this.sr = sampleRate;
    this.opt = {};
    for (var k in DEFAULTS) this.opt[k] = DEFAULTS[k];
    if (opts) this.setOptions(opts);
    this.blockLen = Math.round(sampleRate * 0.01);
    this.blockSec = this.blockLen / sampleRate;
    this.anaLen = 1024 * Math.max(1, Math.round(sampleRate / 48000));
    if (this.anaLen < 1024) this.anaLen = 1024;
    this.ring = new Float32Array(this.anaLen);
    this.ringPos = 0;
    this.blockBuf = new Float32Array(this.blockLen);
    this.blockFill = 0;
    this.blockIndex = 0;
    this.minLag = Math.floor(sampleRate / 3500);
    this.maxLag = Math.ceil(sampleRate / 180);
    this.classify = null;      // レベル2: 音の高さ → どのタネか（無ければレベル1の数え方）
    this.reset();
  }

  // レベル2で使う。fn(高さHz) が {key: タネの番号 か null, heard: 画面に出す聞こえ方} を返す。
  // 渡すと、秒数をタネごとに分けて数え、違う音に変わったら伸ばしを1秒からやり直す。
  Detector.prototype.setClassifier = function (fn) {
    this.classify = typeof fn === 'function' ? fn : null;
    this.noteHist = [];
    this.key = null;
    this.heard = null;
  };

  Detector.prototype.setOptions = function (o) {
    for (var k in o) {
      var v = Number(o[k]);
      if (k in DEFAULTS && isFinite(v)) this.opt[k] = v;
    }
    // 0や負の数などで止まったり壊れたりしないよう、値を範囲に収める
    var R = RANGES;
    for (var key in R) {
      var x = this.opt[key];
      if (x < R[key][0]) x = R[key][0];
      if (x > R[key][1]) x = R[key][1];
      this.opt[key] = x;
    }
    this.opt.tremoloDips = Math.round(this.opt.tremoloDips);
  };

  // 途中で音の処理が止まった時に呼ぶ。今の伸ばしは終わりにし、貯まった秒数と回数は残す。
  Detector.prototype.pause = function () {
    this._endStroke();
    this.state = 'idle';
    this.gateOpen = false;
    this.tremolo = false;
    this.dipTimes = [];
    this.pitchHist = [];
    this.vibrato = false;
    this.dipState = 'high';
    this.peak = -120;
    this.noteHist = [];
    this.key = null;
    this.heard = null;
  };

  Detector.prototype.reset = function () {
    this.now = 0;
    this.total = 0;            // 今の花に向けて貯まった秒数（確定分＋仮置き分。画面に出す値）
    this.committed = 0;        // 確定した秒数。花はこれで咲かせる
    this.blooms = 0;           // 咲かせた回数
    this.waters = 0;           // 水が出た回数
    this.stroke = 0;           // 今の伸ばしの秒数（鳴っている時間だけ数える）
    this.qualified = false;    // 今の伸ばしが水の秒数を越えたか
    this.gap = 0;
    this.gateOpen = false;
    this.env = -120;
    this.clarity = 0;
    this.pitch = 0;
    this.pitchCoarse = 0;
    this.tremolo = false;
    this.dipState = 'high';
    this.peak = -120;
    this.trough = 0;
    this.dipTimes = [];
    this.pitchHist = [];
    this.vibrato = false;
    this.lowSince = 0;
    this.accrual = [];         // 仮置きの [時刻, 秒数]。トレモロと分かったら取り消し、古くなったら確定する
    this.state = 'idle';       // idle | rising | watering | tremolo
    this.events = [];          // 'water' | 'bloom' | 'tremolo' を UI へ渡す（レベル2は {type, key}）
    // レベル2（タネごと）
    this.noteHist = [];        // 直近0.12秒の高さ。真ん中の値でタネを決める
    this.key = null;           // 今鳴っている音のタネ（どれでもなければ null）
    this.heard = null;         // 今の音がどう聞こえたか（画面の「いまのは〜」用）
    this.strokeKey = null;     // 今の伸ばしのタネ
    this.committedBy = {};     // タネごとの確定した秒数
    this.totalBy = {};         // タネごとの秒数（仮置きを含む。画面に出す値）
    this.bloomedBy = {};       // 咲いたタネ
  };

  // 波形を受け取る。長さは何でもよい。
  Detector.prototype.feed = function (samples) {
    for (var i = 0; i < samples.length; i++) {
      var s = samples[i];
      this.ring[this.ringPos] = s;
      this.ringPos = (this.ringPos + 1) % this.anaLen;
      this.blockBuf[this.blockFill++] = s;
      if (this.blockFill === this.blockLen) {
        this.blockFill = 0;
        this._block();
      }
    }
  };

  Detector.prototype._clarity = function () {
    // McLeod の NSDF（正規化した自己相関）で、周期のはっきりさと高さを見る。
    var n = this.anaLen, x = new Float32Array(n), p = this.ringPos, i;
    for (i = 0; i < n; i++) x[i] = this.ring[(p + i) % n];
    var maxLag = Math.min(this.maxLag, n >> 1);
    var nsdf = new Float32Array(maxLag + 2);
    for (var tau = 0; tau <= maxLag + 1; tau++) {
      var acf = 0, m = 0;
      for (i = 0; i + tau < n; i++) {
        acf += x[i] * x[i + tau];
        m += x[i] * x[i] + x[i + tau] * x[i + tau];
      }
      nsdf[tau] = m > 0 ? 2 * acf / m : 0;
    }
    // 最初に負へ下がった後の山を集める。はっきりさは、いちばん高い山で決める。
    var t = 1;
    while (t <= maxLag && nsdf[t] > 0) t++;
    var best = 0, bestLag = 0, peaks = [];
    for (; t <= maxLag; t++) {
      if (t >= this.minLag && nsdf[t] > nsdf[t - 1] && nsdf[t] >= nsdf[t + 1]) {
        peaks.push(t);
        if (nsdf[t] > best) { best = nsdf[t]; bestLag = t; }
      }
    }
    // ビブラートの見分け（レベル1の数え方）には、前の版と同じ粗い高さを使う。
    // 細かい高さに替えると、揺れの測り方が変わってトレモロの判定まで変わるため。
    this.pitchCoarse = bestLag ? this.sr / bestLag : 0;
    // 音の高さは、いちばん高い山の9割を越える最初の山で決める（McLeod の方法）。
    // いちばん高い山をそのまま使うと、1オクターブ下に聞き違えることがある。
    var lag = 0;
    for (var k = 0; k < peaks.length; k++) { if (nsdf[peaks[k]] >= best * 0.9) { lag = peaks[k]; break; } }
    if (lag) {
      // 山の頂を放物線で細かく求める（高い音ほど1サンプルの差が大きいので）
      var a = nsdf[lag - 1], b = nsdf[lag], c = nsdf[lag + 1], den = a - 2 * b + c;
      var shift = den !== 0 ? 0.5 * (a - c) / den : 0;
      if (shift > 0.5) shift = 0.5; else if (shift < -0.5) shift = -0.5;
      this.pitch = this.sr / (lag + shift);
    } else {
      this.pitch = 0;
    }
    return best;
  };

  Detector.prototype._block = function () {
    var o = this.opt, b = this.blockBuf, half = b.length >> 1, s1 = 0, s2 = 0, i;
    for (i = 0; i < half; i++) s1 += b[i] * b[i];
    for (; i < b.length; i++) s2 += b[i] * b[i];
    var db = toDb((s1 + s2) / b.length);
    this.env = db;
    this.blockIndex++;
    if (this.blockIndex % 2 === 0) {
      this.clarity = db > o.onDb - 6 ? this._clarity() : 0;
      this._trackPitch();
      if (this.classify) this._trackNote(db);
    }

    // 鳴っているか（入りと切れに6dBの幅をつけて、ばたつきを抑える）
    if (this.gateOpen) { if (db < o.onDb - 6) this.gateOpen = false; }
    else if (db > o.onDb) this.gateOpen = true;

    // 弓の返しの谷は短い（20〜40ミリ秒）ので、5ミリ秒きざみで見る
    this.now += this.blockSec / 2;
    this._trackDips(toDb(s1 / half));
    this.now += this.blockSec / 2;
    this._trackDips(toDb(s2 / (b.length - half)));

    // トレモロか: 0.7秒の中に弓の返し（音量の谷）が何回あるか
    var win = o.tremoloWindowSec, now = this.now;
    while (this.dipTimes.length && this.dipTimes[0] < now - win) this.dipTimes.shift();
    var wasTrem = this.tremolo;
    this.tremolo = this.dipTimes.length >= o.tremoloDips;
    if (this.tremolo && !wasTrem) this._onTremolo();

    // トレモロと分かるまでの遅れ（窓の長さ＋0.2秒）より古い分を確定し、確定分だけで花を咲かせる
    var hold = win + 0.2;
    while (this.accrual.length && this.accrual[0][0] < now - hold) {
      var ac = this.accrual.shift();
      this.committed += ac[1];
      if (this.classify) this.committedBy[ac[2]] = (this.committedBy[ac[2]] || 0) + ac[1];
    }
    if (!this.classify) {
      while (this.committed >= o.bloomSec) {
        this.committed -= o.bloomSec;
        this.blooms++;
        this._emit('bloom');
      }
    } else {
      // タネごとに、確定した秒数が開花の秒数に届いたら1回だけ咲かせる
      for (var bk in this.committedBy) {
        if (!this.bloomedBy[bk] && this.committedBy[bk] >= o.bloomSec) {
          this.bloomedBy[bk] = true;
          this.blooms++;
          this._emit({ type: 'bloom', key: Number(bk) });
        }
      }
    }

    var voiced = this.gateOpen && this.clarity >= o.minClarity && !this.tremolo &&
                 (!this.classify || this.key !== null);
    // レベル2: 違うタネの音に変わったら、伸ばしを1秒からやり直す

    var secs = d.opt.bloomSec > 0 ? d.opt.bloomSec : BLOOM_DEFAULT;
    var pct = finished ? 1 : clamp(d.total / secs, 0, 1);
    // 花は咲いた知らせ（bloom）が来てから出す。合計が開花の秒数に届いても、確定するまでの約0.9秒はつぼみのまま
    setStage(finished ? 'flower' : stageFor(Math.min(pct, 0.99)));
    // 背の伸びと、ぽよんは0.5秒きざみ（なめらかでなく、ぴょこっと伸びる）
    var half = finished ? secs * 2 : Math.floor(Math.min(d.total, secs) * 2 + 1e-6);
    setGrow(stageShown, finished ? 1 : clamp(half / 2 / secs, 0, 1));
    if (!finished) boing(half);

    var p100 = Math.round(pct * 100);
    if (p100 !== lastBarPct) {
      lastBarPct = p100;
      barFill.style.width = p100 + '%';
    }

    var shown = finished ? secs : Math.min(d.total, secs);
    // 目盛りは秒の整数で出す（1秒未満の音はそもそも足さない）
    var txt = Math.floor(shown + 1e-6) + ' / ' + secs + ' びょう';
    if (txt !== lastBarTxt) { lastBarTxt = txt; barText.textContent = txt; }

    if (d.waters !== lastWaters) {
      lastWaters = d.waters;
      waterLine.textContent = 'みずやり ' + d.waters + ' かい';
    }

    if (settings.classList.contains('open')) {
      var mp = clamp((d.env + 70) / 50, 0, 1) * 100;
      meterFill.style.width = mp.toFixed(0) + '%';
    }
  }

  /* ---------- せってい ---------- */
  function markPct() { return clamp((cfg.onDb + 70) / 50, 0, 1) * 100; }

  function syncSettingsUI() {
    bloomIn.value = String(cfg.bloomSec);
    bloomOut.textContent = String(cfg.bloomSec);
    waterIn.value = String(cfg.waterStartSec);
    waterOut.textContent = cfg.waterStartSec.toFixed(1);
    onDbIn.value = String(cfg.onDb);
    onDbOut.textContent = String(cfg.onDb);
    meterMark.style.left = markPct().toFixed(1) + '%';
    segOut.textContent = DIP_SCALE[cfg.tremoloDipDb] || 'ふつう';
    var bs = segGroup.getElementsByTagName('button');
    for (var i = 0; i < bs.length; i++) {
      bs[i].classList.toggle('on', Number(bs[i].getAttribute('data-dip')) === cfg.tremoloDipDb);
    }
  }

  bloomIn.addEventListener('input', function () {
    cfg.bloomSec = clamp(parseInt(bloomIn.value, 10) || BLOOM_DEFAULT, 3, 60);
    bloomOut.textContent = String(cfg.bloomSec);
    det.setOptions({ bloomSec: cfg.bloomSec });
    saveCfg();
  });

  waterIn.addEventListener('input', function () {
    var v = clamp(Math.round((parseFloat(waterIn.value) || WATER_DEFAULT) * 10) / 10, 0.5, 2);
    cfg.waterStartSec = v;
    waterOut.textContent = v.toFixed(1);
    det.setOptions({ waterStartSec: v });
    saveCfg();
  });

  onDbIn.addEventListener('input', function () {
    cfg.onDb = clamp(parseInt(onDbIn.value, 10) || ONDB_DEFAULT, -70, -20);
    onDbOut.textContent = String(cfg.onDb);
    meterMark.style.left = markPct().toFixed(1) + '%';
    det.setOptions({ onDb: cfg.onDb });
    saveCfg();
  });

  segGroup.addEventListener('click', function (e) {
    var b = e.target;
    while (b && b !== segGroup && b.tagName !== 'BUTTON') b = b.parentNode;
    if (!b || b === segGroup) return;
    var dip = Number(b.getAttribute('data-dip'));
    if (!dip) return;
    cfg.tremoloDipDb = dip;
    det.setOptions({ tremoloDipDb: dip });
    saveCfg();
    syncSettingsUI();
  });

  gearBtn.addEventListener('click', function () {
    settings.classList.add('open');
    syncSettingsUI();
  });
  $('closeSettings').addEventListener('click', function () {
    settings.classList.remove('open');
  });
  settings.addEventListener('click', function (e) {
    if (e.target === settings) settings.classList.remove('open');
  });

  /* ---------- マイク ---------- */
  var audio = { ctx: null, stream: null, src: null, sp: null, mute: null };

  function reasonOf(err) {
    var n = (err && err.name) || '';
    if (n === 'NotAllowedError' || n === 'SecurityError') return 'マイクの使用が許可されていません';
    if (n === 'NotFoundError' || n === 'DevicesNotFoundError') return 'マイクが見つかりません';
    if (n === 'NotReadableError' || n === 'TrackStartError') return 'マイクがほかのアプリで使われています';
    if (n === 'OverconstrainedError') return 'マイクの設定が合いません';
    if (err && err.message) return String(err.message);
    return 'はっきりしない理由';
  }

  function showMicError(reason) {
    $('micErrTitle').textContent = 'マイクが使えません: ' + reason;
    $('micErrSub').textContent = 'https://ngmt4amtk-web.github.io/violin-mizuyari/ から開くと、マイクを使えます。';
    $('micErr').classList.add('show');
  }
  function hideMicError() {
    $('micErr').classList.remove('show');
  }

  function teardown() {
    if (audio.stream) {
      try { audio.stream.getTracks().forEach(function (tr) { tr.stop(); }); } catch (e) { /* 無視 */ }
    }
    audio.ctx = null;
    audio.stream = null;
    audio.src = null;
    audio.sp = null;
    audio.mute = null;
  }

  var starting = false;   // マイクの許可を待っている間に、もう一度始めない（2本で聞くと2倍速になる）
  var everRan = false;    // 一度でも音の処理が動いたか（ボタンの文字を「はじめる」か「つづける」にする）
  var micFailed = false;  // マイクが使えなかった・切れた後は、画面に触れても聞き直さない（ボタンだけで聞き直す。許可を何度も聞かない）
  function startAudio() {
    if (starting) return;
    if (audio.ctx) {
      // 止まっていた音の処理を、ボタンを押したその場で再開する
      if (audio.ctx.state !== 'running') {
        audio.ctx.resume().catch(function () { /* もう一度押せばよい */ });
      }
      return;
    }
    hideMicError();

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      micFailed = true; showMicError('このブラウザではマイクを使えません');
      return;
    }
    if (window.isSecureContext === false) {
      micFailed = true; showMicError('安全でない接続のためマイクを使えません');
      return;
    }

    startBtn.disabled = true;

    // AudioContext はボタンを押したその場で作る（Safari は押した直後でないと音の処理を始めない）
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { startBtn.disabled = false; micFailed = true; showMicError('このブラウザでは音の処理ができません'); return; }
    var ctx0 = new AC();
    ctx0.resume().catch(function () { /* 後で再開する */ });
    starting = true;

    navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    }).then(function (stream) {
      starting = false;
      audio.stream = stream;
      audio.ctx = ctx0;
      var ctx = ctx0;
      if (typeof ctx.createScriptProcessor !== 'function') throw new Error('ScriptProcessor が使えません');
      var src = ctx.createMediaStreamSource(audio.stream);
      var sp = ctx.createScriptProcessor(2048, 1, 1);
      var mute = ctx.createGain();
      mute.gain.value = 0;

      // 前の判定器から、進み具合（合計秒数・水やりの回数・咲いた回数）を引き継ぐ
      var prev = det;
      det = new window.SustainDetector(ctx.sampleRate, cfg);
      det.committed = prev.total;
      det.total = prev.total;
      det.waters = prev.waters;
      wg.detector = det;

      sp.onaudioprocess = function (e) {
        if (finished) return;   // 咲いた後は「もういちど」まで数えない
        det.feed(e.inputBuffer.getChannelData(0));
      };
      // タブを裏に回した・画面を消した時は、今の伸ばしを終わりにして「つづける」を出す
      function syncBtn() {
        if (ctx.state === 'running') { everRan = true; startBtn.textContent = 'きいているよ'; startBtn.disabled = true; }
        else if (ctx.state !== 'closed') { det.pause(); startBtn.textContent = everRan ? 'つづける' : 'はじめる'; startBtn.disabled = false; }
      }
      ctx.onstatechange = syncBtn;
      // マイクが外れた時は、進み具合を残したまま「はじめる」に戻す
      audio.stream.getAudioTracks().forEach(function (tr) {
        tr.addEventListener('ended', function () {
          det.pause();
          try { ctx.close(); } catch (e) { /* 無視 */ }
          teardown();
          startBtn.textContent = 'はじめる';
          startBtn.disabled = false;
          micFailed = true;
          showMicError('マイクが切れました');
        });
      });
      src.connect(sp);
      sp.connect(mute);
      mute.connect(ctx.destination);

      audio.src = src;
      audio.sp = sp;
      audio.mute = mute;

      // 再開を待たずにボタンの表示を決める（止まったままなら「つづける」を押せる）
      syncBtn();
      ctx.resume().catch(function () { /* 「つづける」から再開できる */ });
      lastBarPct = -1;
      lastBarTxt = '';
      lastWaters = -1;
      measureDrops();
    }).catch(function (err) {
      starting = false;
      if (!audio.sp) { teardown(); try { ctx0.close(); } catch (e) { /* 無視 */ } }
      startBtn.disabled = false;
      micFailed = true;
      showMicError(reasonOf(err));
    });
  }

  startBtn.addEventListener('click', function () { micFailed = false; startAudio(); });

  /* ---------- テスト用の口 ---------- */
  var wg = {
    detector: det,
    audio: audio,
    getState: function () {
      return {
        state: det.state,
        total: det.total,
        blooms: det.blooms,
        waters: det.waters,
        env: det.env,
        canVisible: canVisible,
        canPouring: canPouring,
        dropsOn: dropsOn,
        finished: finished,
        button: startBtn.textContent + (startBtn.disabled ? '(押せない)' : '(押せる)'),
        stage: stageShown
      };
    }
  };
  window.__wg = wg;

  /* ---------- 起し ---------- */
  setStage('seed');
  syncSettingsUI();
  measureDrops();
  window.addEventListener('load', measureDrops);
  requestAnimationFrame(frame);

  // 開いたらすぐ、マイクの許可を聞いて聞き始める（本人 2026-11-04「レベル選択したらマイクの許可聞かれて、始める押さなくても始まって欲しい」）。
  // ブラウザが「画面に触れるまで音の処理を始めない」時は、ボタンが「はじめる」のまま残り、画面のどこに触れても始まる
  setTimeout(startAudio, 60);
  document.addEventListener('pointerdown', function (e) {
    if (finished || micFailed || settings.classList.contains('open')) return;
    if (e.target.closest && e.target.closest('button, a, input, #settings')) return;
    if (!audio.ctx || audio.ctx.state !== 'running') startAudio();
  });
})();

</script>
</body>
</html>
