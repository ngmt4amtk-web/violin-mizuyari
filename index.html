<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>みずやりゲーム</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    color: #14361f;
    background: linear-gradient(#8ed8ff 0%, #b9e8ff 46%, #dff4ff 62%, #c6e9a8 62%, #a9dc86 100%) fixed;
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(16px, 4vmin, 36px);
    padding: 24px max(16px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  h1 {
    margin: 0; text-align: center;
    font-size: clamp(30px, 7vmin, 60px); font-weight: 900; color: #0c4b2c; letter-spacing: .03em;
    text-shadow: 0 2px 0 #fff, 0 3px 12px rgba(255,255,255,.8);
  }
  .levels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(12px, 3vmin, 28px); width: min(820px, 100%); }
  @media (max-width: 560px) { .levels { grid-template-columns: 1fr; } }
  .lv {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: clamp(18px, 4vmin, 34px) 14px;
    border-radius: 26px; text-decoration: none; color: inherit;
    background: #fff; box-shadow: 0 7px 0 rgba(20,80,47,.22), 0 12px 24px rgba(20,60,40,.14);
    border: 4px solid #2f9e5f;
  }
  .lv:active { transform: translateY(3px); box-shadow: 0 4px 0 rgba(20,80,47,.22); }
  .lv:focus-visible { outline: 4px solid #ffd75e; outline-offset: 3px; }
  .lv.mame { border-color: #e0a800; background: #fffbe8; }
  .levels { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 860px) { .levels { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 480px) { .levels { grid-template-columns: 1fr; } }
  .lv .n { font-size: clamp(16px, 2.8vmin, 22px); font-weight: 800; color: #2f7d4f; }
  .lv .t { font-size: clamp(26px, 5.4vmin, 46px); font-weight: 900; color: #0c4b2c; line-height: 1.1; }
  .lv .d { font-size: clamp(14px, 2.3vmin, 19px); font-weight: 700; color: #3c6a50; text-align: center; line-height: 1.5; }
  .lv .t { white-space: nowrap; }
  .lv .t.long { font-size: clamp(22px, 4.4vmin, 34px); line-height: 1.5; }
  /* 7枠が1画面に入るよう、広い画面は4列にする */
  @media (min-width: 1000px) { .levels { grid-template-columns: repeat(4, minmax(0, 1fr)); width: min(1120px, 100%); } }
  .dots { display: flex; gap: 6px; margin-top: 4px; }
  .dots i { width: 16px; height: 16px; border-radius: 50%; display: block; }
</style>
</head>
<body>
  <h1>みずやりゲーム</h1>
  <div class="levels">
    <a class="lv" href="app.html">
      <span class="n">レベル 1</span>
      <span class="t">のばす</span>
      <span class="d">音を のばして<br>はなを 1つ さかせよう</span>
    </a>
    <a class="lv" href="kaihou.html">
      <span class="n">レベル 2</span>
      <span class="t long">かいほうげん</span>
      <span class="d">ソ・レ・ラ・ミの タネを<br>ぜんぶ さかせよう</span>
      <span class="dots" aria-hidden="true"><i style="background:#1F5FD1"></i><i style="background:#EE8A00"></i><i style="background:#CC1030"></i><i style="background:#138A3A"></i></span>
    </a>
    <a class="lv" href="yubi.html?lv=2">
      <span class="n">レベル 3</span>
      <span class="t">ゆび 1つ</span>
      <span class="d">げんと ゆび（0・1・2）を えらんで<br>タネを 1つ さかせよう</span>
      <span class="dots" aria-hidden="true"><i style="background:#1F5FD1"></i><i style="background:#EE8A00"></i><i style="background:#CC1030"></i><i style="background:#138A3A"></i></span>
    </a>
    <a class="lv" href="yubi.html?lv=3">
      <span class="n">レベル 4</span>
      <span class="t">ゆび 0〜2</span>
      <span class="d">0・1・2の タネを<br>ぜんぶ さかせよう</span>
      <span class="dots" aria-hidden="true"><i style="background:#1F5FD1"></i><i style="background:#EE8A00"></i><i style="background:#CC1030"></i><i style="background:#138A3A"></i></span>
    </a>
    <a class="lv" href="yubi.html?lv=4">
      <span class="n">レベル 5</span>
      <span class="t">ゆび 0〜3</span>
      <span class="d">0〜3の タネを<br>ぜんぶ さかせよう</span>
      <span class="dots" aria-hidden="true"><i style="background:#1F5FD1"></i><i style="background:#EE8A00"></i><i style="background:#CC1030"></i><i style="background:#138A3A"></i></span>
    </a>
    <a class="lv" href="yubi.html?lv=5">
      <span class="n">レベル 6</span>
      <span class="t">ゆび 0〜4</span>
      <span class="d">0〜4の タネを<br>ぜんぶ さかせよう</span>
      <span class="dots" aria-hidden="true"><i style="background:#1F5FD1"></i><i style="background:#EE8A00"></i><i style="background:#CC1030"></i><i style="background:#138A3A"></i></span>
    </a>
    <a class="lv mame" href="mame.html">
      <span class="n">あそび</span>
      <span class="t">まめのき</span>
      <span class="d">じかんの なかで<br>どこまで のびるかな？</span>
    </a>
  </div>
</body>
</html>
